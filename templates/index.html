<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv UT Bot Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #2563eb; --sidebar-bg: #0f172a; --content-bg: #f8fafc; --card-bg: #ffffff; --text-main: #1e293b; --log-bg: #1e1e1e; --log-text: #d4d4d4; }
        body { background-color: var(--content-bg); color: var(--text-main); font-family: 'Inter', sans-serif; }
        .sidebar { height: 100vh; background-color: var(--sidebar-bg); color: white; position: fixed; width: 260px; }
        .content { margin-left: 260px; padding: 30px; }
        .card { background-color: var(--card-bg); border: none; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 24px; border-radius: 16px; }
        .metric-card { border-left: 4px solid var(--primary); }
        .log-container { height: 400px; overflow-y: auto; background-color: var(--log-bg); color: var(--log-text); padding: 20px; font-family: monospace; border-radius: 12px; }
        .nav-link { color: rgba(255,255,255,0.6); padding: 14px 20px; }
        .nav-link.active { background-color: var(--primary); color: white; }
    </style>
</head>
<body>
    <div class="sidebar d-flex flex-column">
        <div class="p-4"><h4 class="fw-bold"><i class="fas fa-robot me-2 text-primary"></i>DerivBot</h4></div>
        <ul class="nav nav-pills flex-column mb-auto">
            <li><a href="#" class="nav-link active" id="btn-dash">Overview</a></li>
            <li><a href="#" class="nav-link" id="btn-settings">Settings</a></li>
            <li><a href="#" class="nav-link" id="btn-backtest">Backtest</a></li>
        </ul>
        <div class="p-4"><button id="toggle-bot" class="btn btn-primary w-100">Start Bot</button></div>
    </div>
    <div class="content">
        <div id="global-training-alert" class="alert alert-info mb-4" style="display:none;">Updating models...</div>
        <div id="section-dash">
            <div class="row g-4 mb-4">
                <div class="col-md-3"><div class="card p-4 metric-card"><h6>Status</h6><h3 id="bot-status-text">Offline</h3></div></div>
                <div class="col-md-3"><div class="card p-4 metric-card"><h6>Balance</h6><h3 id="account-balance">$0.00</h3></div></div>
                <div class="col-md-3"><div class="card p-4 metric-card"><h6>Wins/Losses</h6><h3 id="trade-summary">0 / 0</h3></div></div>
            </div>
            <div class="card p-4"><h5>Logs</h5><div id="logs" class="log-container"></div></div>
        </div>
        <div id="section-settings" style="display:none;">
            <div class="card p-4">
                <h4>Config</h4>
                <form id="settings-form">
                    <input type="password" name="api_token" class="form-control mb-2" placeholder="Token">
                    <input type="text" name="app_id" class="form-control mb-2" value="99999">
                    <input type="number" name="fetch_days" class="form-control mb-2" value="730">
                    <button type="submit" class="btn btn-primary">Save</button>
                </form>
            </div>
        </div>
        <div id="section-backtest" style="display:none;">
            <div class="card p-4"><h4>Simulation</h4><button id="run-backtest" class="btn btn-primary">Run</button><div id="bt-results" class="mt-4"></div></div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        const socket = io();
        socket.on('log', (msg) => { const p = document.createElement('div'); p.innerText = msg; document.getElementById('logs').appendChild(p); document.getElementById('logs').scrollTop = 99999; });
        socket.on('status_update', (d) => {
            document.getElementById('bot-status-text').innerText = d.active ? 'Running' : 'Offline';
            document.getElementById('toggle-bot').innerText = d.active ? 'Stop' : 'Start';
            document.getElementById('account-balance').innerText = '$' + d.balance;
            document.getElementById('trade-summary').innerText = d.wins + ' / ' + d.losses;
        });
        document.getElementById('toggle-bot').onclick = () => fetch('/toggle_bot', {method:'POST'});
        function show(id) { ['dash','settings','backtest'].forEach(s => document.getElementById('section-'+s).style.display = s===id?'block':'none'); }
        document.getElementById('btn-dash').onclick = () => show('dash');
        document.getElementById('btn-settings').onclick = () => show('settings');
        document.getElementById('btn-backtest').onclick = () => show('backtest');
        document.getElementById('settings-form').onsubmit = async (e) => {
            e.preventDefault();
            const d = Object.fromEntries(new FormData(e.target));
            await fetch('/save_settings', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(d)});
            alert('Saved');
        };
        setInterval(async () => { const r = await fetch('/get_system_status').then(r=>r.json()); document.getElementById('global-training-alert').style.display = r.is_initial_training?'block':'none'; }, 5000);
    </script>
</body>
</html>
